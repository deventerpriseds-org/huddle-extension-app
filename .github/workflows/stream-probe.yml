name: stream-probe

# Diagnostic-only: run a runner-side (open-internet) HTTP timing test against the deployed
# /api/public/stream-probe route to settle ONE premise — does Azure SWA buffer streamed Node
# responses? Chunks arriving ~500ms apart ⇒ stream passes through (SSE viable); all-at-once at
# ~3s ⇒ SWA buffers (poll-partial required). The CCR session's egress proxy denies
# *.azurestaticapps.net, so this can't run from the session. Delete once the premise is settled.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Base URL of the deployed app"
        required: false
        default: "https://icy-flower-0f415200f.7.azurestaticapps.net"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Time the streamed response
        run: |
          python3 - "${{ github.event.inputs.app_url }}/api/public/stream-probe" <<'PY'
          import sys, time, urllib.request
          URL = sys.argv[1]
          print(f"GET {URL}\n")
          t0 = time.time(); last = t0; arrivals = []
          req = urllib.request.Request(URL, headers={"Accept": "text/plain"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"HTTP {resp.status}  headers:")
              for k in ("content-type","transfer-encoding","content-length",
                        "x-accel-buffering","cache-control","content-encoding"):
                  v = resp.headers.get(k)
                  if v is not None: print(f"  {k}: {v}")
              print()
              buf = b""
              while True:
                  b = resp.read(64)
                  if not b: break
                  now = time.time(); buf += b
                  while b"\n" in buf:
                      line, buf = buf.split(b"\n", 1)
                      ems = int((now-t0)*1000); gap = int((now-last)*1000); last = now
                      arrivals.append((ems, gap, line.decode(errors="replace")))
                      print(f"  clientMs={ems:5d}  gapSinceLast={gap:5d}  {line.decode(errors='replace')}")
          print(f"\ntotal client wall time: {int((time.time()-t0)*1000)}ms")
          gaps = [g for (_,g,ln) in arrivals if ln.startswith('chunk=')]
          if len(gaps) >= 3:
              inter = gaps[1:]
              spread = sum(1 for g in inter if g >= 250)
              print(f"inter-chunk gaps (ms): {inter}")
              if spread >= max(1, len(inter)//2):
                  print("VERDICT: STREAMING PASSES THROUGH — chunks spread out; SSE viable.")
              else:
                  print("VERDICT: BUFFERED — chunks arrived together; poll-partial required.")
          else:
              print("VERDICT: INCONCLUSIVE — too few chunk lines observed.")
          PY
