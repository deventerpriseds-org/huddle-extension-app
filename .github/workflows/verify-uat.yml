name: Verify UAT (live, real browser)

# Generic GHA-runner Playwright harness (eds-claude-skills' verify-work skill, "GHA-verify
# variant" / gha-playwright-uat pointer skill). run-uat.mjs is app-agnostic; huddle-checks.mjs
# is the only app-specific piece — currently covers panel collapse, avatar-image regression
# (ACT-huddle-2), and the standup-ceremony timing the user has reported as broken.
# Replaces the deleted verify-panel-collapse.yml (superseded by this generic pair).

on:
  workflow_dispatch:
    inputs:
      checks_file:
        description: "Path to the checks module to run (default: full huddle-checks suite)"
        required: false
        default: ".claude/skills/test-agent-serverfn/scripts/huddle-checks.mjs"
      viewport_w:
        description: "Viewport width. Use 390 for the owner's phone — the 2026-09-13 visual defects were width-dependent and a desktop width hid every one of them."
        required: false
        default: "1000"
      viewport_h:
        description: "Viewport height (390x844 is the phone pair). Defaults preserve the pre-existing 1000x680 the huddle-checks suite was written against."
        required: false
        default: "680"

permissions:
  contents: write

jobs:
  verify-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright@1.64.1   # pinned: playwright@1.65.0 was published before playwright-core@1.65.0 (npm ETARGET, 2026-11-05)
          npx playwright install chromium --with-deps

      - name: Run UAT
        env:
          APP_URL: https://icy-flower-0f415200f.7.azurestaticapps.net
          UAT_TOKEN: ${{ secrets.UAT_BYPASS_TOKEN }}
          CHECKS_FILE: ${{ github.workspace }}/${{ inputs.checks_file }}
          SHOT_DIR: uat-shots
          # ONE definition only. A duplicate YAML key silently takes the LAST value, so an input
          # added above a hardcoded pair would be overridden with nothing failing (caught 2026-09-13).
          UAT_VIEWPORT_W: ${{ inputs.viewport_w }}
          UAT_VIEWPORT_H: ${{ inputs.viewport_h }}
          # Real voice barge: synthesized speech (ElevenLabs) injected into a stubbed mic → real VAD/STT.
          FAKE_MIC: '1'
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}
        run: node .claude/skills/test-agent-serverfn/scripts/run-uat.mjs

      - name: Upload screenshots + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-shots
          path: uat-shots/
          retention-days: 7

      # CCR sessions can't download the artifact zip (proxy blocks the blob redirect), so publish the
      # shots to a throwaway orphan branch the session CAN reach via git (the git proxy works).
      # ONE BRANCH PER RUN: uat-shots-run-<run_id>. Owner, 2026-11-08: "make sure a mechanized rule is in
      # place preventing a branch being overwritten by another session". The old shared `uat-shots`
      # branch was force-pushed by EVERY run, so with parallel sessions one session's screenshots were
      # replaced by another's before it read them (run 42496877380's shots were overwritten by 42496820414
      # within minutes). A per-run name cannot be overwritten by another run. Read it with:
      #   git fetch origin uat-shots-run-<run_id> && git show FETCH_HEAD:uat-shots/<file>.png > /tmp/x.png
      - name: Publish shots to this run's own branch
        if: always()
        env:
          SHOTS_BRANCH: uat-shots-run-${{ github.run_id }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "gha-uat"
          git checkout --orphan "$SHOTS_BRANCH"
          git reset >/dev/null 2>&1 || true
          shopt -s nullglob
          shots=(uat-shots/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "::warning::this run produced NO screenshots -- no shots branch was created for it."
            exit 0
          fi
          git add -f uat-shots/*.png uat-shots/results.json
          git commit -q -m "uat shots — run ${{ github.run_id }}" || { echo "no shots to commit"; exit 0; }
          # A brand-new name: no force needed, and a plain push can never replace another run's branch.
          git push origin "$SHOTS_BRANCH"
          echo "Shots published to branch $SHOTS_BRANCH"
          # Housekeeping: drop per-run shot branches older than 7 days (the artifact zip is kept 7 days too).
          cutoff=$(date -u -d '7 days ago' +%s)
          git ls-remote --heads origin 'uat-shots-run-*' | awk '{print $2}' | while read -r ref; do
            b=${ref#refs/heads/}
            git fetch -q --depth 1 origin "$b" 2>/dev/null || continue
            ts=$(git log -1 --format=%ct FETCH_HEAD 2>/dev/null || echo "$cutoff")
            if [ "$ts" -lt "$cutoff" ]; then git push -q origin --delete "$b" || true; fi
          done
