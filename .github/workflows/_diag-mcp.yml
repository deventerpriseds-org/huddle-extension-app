name: _diag-mcp (temporary, delete after use)

on:
  workflow_dispatch:

env:
  RG: EnterpriseDS_ResourceGRP
  ACA_APP: huddle-pg-mcp

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        run: |
          az login --service-principal -u "${{ secrets.AZURE_CLIENT_ID }}" \
            -p "${{ secrets.AZURE_CLIENT_SECRET }}" --tenant "${{ secrets.AZURE_TENANT_ID }}" >/dev/null
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null 2>&1 || true
      - name: Inspect
        run: |
          echo "=== revisions ==="
          az containerapp revision list -g "$RG" -n "$ACA_APP" \
            --query "[].{name:name,active:properties.active,state:properties.runningState,replicas:properties.replicas}" -o table 2>&1 | head -10 || true
          echo "=== OAUTH container logs (startup/crash) ==="
          az containerapp logs show -g "$RG" -n "$ACA_APP" --container oauth --tail 100 2>&1 | tail -100 || echo "(oauth logs unavailable)"
          echo "=== PGMCP container logs ==="
          az containerapp logs show -g "$RG" -n "$ACA_APP" --container pgmcp --tail 30 2>&1 | tail -30 || echo "(pgmcp logs unavailable)"
          FQDN=$(az containerapp show -g "$RG" -n "$ACA_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "=== re-probe (warmed up) ==="
          curl -sS -m 15 -o /dev/null -w "PRM  -> %{http_code}\n" "https://${FQDN}/.well-known/oauth-protected-resource/sse" || echo "prm fail"
          curl -sS -m 15 -o /dev/null -w "AS   -> %{http_code}\n" "https://${FQDN}/.well-known/oauth-authorization-server" || echo "as fail"
          curl -sS -m 15 -o /dev/null -w "/sse -> %{http_code}\n" "https://${FQDN}/sse" || echo "sse fail"
