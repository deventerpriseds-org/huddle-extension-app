name: Realign iris/sam platform assistants with repo snapshot

# One-off: realign the platform assistants for iris-chase and sam-trent with the
# canonical instructions restored into openai-assistant-snapshots.json (undoing a
# destructive overwrite). Pushes the restored text UP to the platform so the daily
# pull-only refresh won't re-introduce the overwrite, re-snapshots to confirm, and
# deploys.

on:
  workflow_dispatch:

jobs:
  revert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (public npm)
        run: |
          rm -f bun.lock
          sed -i 's/^minimumReleaseAge = .*/minimumReleaseAge = 0/' bunfig.toml
          bun install --registry https://registry.npmjs.org

      - name: Realign platform assistants to the restored canonical text
        run: bun run scripts/revert-assistant-instructions.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Re-snapshot to confirm platform matches repo
        run: bun run scripts/fetch-openai-assistants.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit any snapshot change and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/features/huddle/data/openai-assistant-snapshots.json; then
            git add src/features/huddle/data/openai-assistant-snapshots.json
            git commit -m "Re-snapshot iris/sam after platform realign"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Snapshot already matches platform."
          fi
          echo "Dispatching deploy."
          gh workflow run deploy-swa.yml --ref ${{ github.ref_name }}
