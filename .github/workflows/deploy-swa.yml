name: Deploy to Azure (Static Web Apps)

# Deploys Huddle to an Azure Static Web App — the same model as the rest of the
# enterpriseds fleet, and (unlike App Service) it needs no dedicated-VM quota.
# Huddle is server-rendered, so Nitro's `azure-swa` preset packages the SSR
# server as the SWA managed API function; static assets are served by the CDN.
#
# Everything flows from GitHub org secrets: the deploy SP creates/looks up the
# SWA, the runtime secrets are pushed as SWA app settings, and the SWA's real
# hostname is auto-registered as the Entra sign-in redirect URI. No portal, no
# manual secret entry.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

env:
  SWA_NAME: enterpriseds-huddle-web
  AZURE_RESOURCE_GROUP: EnterpriseDS_ResourceGRP
  SWA_LOCATION: eastus2 # Static Web Apps region
  ENTRA_APP_NAME: enterpriseds-huddle-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret presence check
        run: |
          for k in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
                   ELEVENLABS_API_KEY ELEVENLABS_DEFAULT_VOICE_ID OPENAI_API_KEY LOVABLE_API_KEY \
                   TAVILY_API_KEY AZURE_PG_URL JOURNEY_PROXY_TOKEN; do
            if [ -n "${!k}" ]; then echo "$k: present"; else echo "$k: MISSING"; fi
          done
          # Web Push is optional — absence just disables notify-while-away (durable turns still work).
          for k in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY; do
            if [ -n "${!k}" ]; then echo "$k: present"; else echo "$k: not set (Web Push disabled)"; fi
          done
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AZURE_PG_URL: ${{ secrets.AZURE_PG_URL }}
          JOURNEY_PROXY_TOKEN: ${{ secrets.JOURNEY_PROXY_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (public npm)
        run: |
          rm -f bun.lock
          sed -i 's/^minimumReleaseAge = .*/minimumReleaseAge = 0/' bunfig.toml
          # The npm registry occasionally refuses connections mid-install on the runner
          # (ConnectionRefused / FailedToOpenSocket on random tarballs). Retry with backoff so a
          # transient blip doesn't fail the whole deploy.
          # The npm CDN is intermittently refusing this runner's connections (ConnectionRefused /
          # FailedToOpenSocket downloading tarballs). bun's HTTP client gives up hard on that error
          # (oven-sh/bun#5548) — retries plateau with a stubborn handful of packages never landing.
          # Strategy: try bun a few times (fast path when the registry is healthy), then fall back to
          # npm, whose per-tarball exponential-backoff retry on a different network stack rides through
          # refusals bun can't. Either installer produces a standard node_modules the build can use.
          for attempt in 1 2 3; do
            if bun install --registry https://registry.npmjs.org --network-concurrency 4; then
              echo "bun install succeeded on attempt $attempt"; exit 0
            fi
            echo "bun install failed (attempt $attempt) — retrying after 20s"
            sleep 20
          done
          echo "bun exhausted — falling back to npm install with per-request retries"
          rm -rf node_modules
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund --registry https://registry.npmjs.org \
                 --fetch-retries 10 --fetch-retry-mintimeout 15000 --fetch-retry-maxtimeout 120000 --maxsockets 3; then
              echo "npm install succeeded on attempt $attempt"; exit 0
            fi
            echo "npm install failed (attempt $attempt) — retrying after 30s"
            sleep 30
          done
          echo "::error::both bun and npm install failed — npm registry still refusing this runner"; exit 1

      - uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Ensure Static Web App exists + read hostname/token
        run: |
          set -euo pipefail
          az staticwebapp create --name "$SWA_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --location "$SWA_LOCATION" --sku Free --only-show-errors || true
          HOST=$(az staticwebapp show --name "$SWA_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query defaultHostname -o tsv)
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_HOST=$HOST" >> "$GITHUB_ENV"
          echo "SWA_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Static Web App: https://$HOST"

      - name: Register redirect URI + resolve Entra client id
        # Point the Entra app's SPA redirect at the SWA hostname (dynamic) and
        # resolve its client id, then write the VITE_* build env.
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          GT=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          APP=$(curl -s -G "https://graph.microsoft.com/v1.0/applications" \
            --data-urlencode "\$filter=displayName eq '${ENTRA_APP_NAME}'" \
            -H "Authorization: Bearer $GT" \
            | python3 -c 'import sys,json;a=json.load(sys.stdin).get("value",[]);print((a[0]["id"]+" "+a[0]["appId"]) if a else "")')
          OBJID=$(echo "$APP" | cut -d' ' -f1)
          APPID=$(echo "$APP" | cut -d' ' -f2)
          if [ -n "$OBJID" ]; then
            URIS="\"https://${SWA_HOST}\",\"https://huddle-extension-app.lovable.app\",\"http://localhost:3000\""
            curl -s -X PATCH "https://graph.microsoft.com/v1.0/applications/${OBJID}" \
              -H "Authorization: Bearer $GT" -H "Content-Type: application/json" \
              -d "{\"spa\":{\"redirectUris\":[${URIS}]}}" >/dev/null
            echo "Registered redirect URI https://${SWA_HOST} on ${ENTRA_APP_NAME} (${APPID})"
            AUTH="https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0"
          else
            echo "Entra app '${ENTRA_APP_NAME}' not found — run azure-entra-app.yml first. Using fallback VITE_ENTRA_* secrets."
            APPID="${{ secrets.VITE_ENTRA_CLIENT_ID }}"
            AUTH="${{ secrets.VITE_ENTRA_AUTHORITY }}"
          fi
          {
            echo "VITE_ENTRA_CLIENT_ID=${APPID}"
            echo "VITE_ENTRA_AUTHORITY=${AUTH}"
            echo "VITE_ENTRA_TENANT_ID=${AZURE_TENANT_ID}"
            echo "VITE_ENTRA_TENANT_NAME=enterpriseds"
          } > .env.production
          # Hand the resolved client id + authority to later steps so the server
          # runtime verifies tokens against the SAME authority the client used.
          {
            echo "ENTRA_CLIENT_ID_RESOLVED=${APPID}"
            echo "ENTRA_AUTHORITY_RESOLVED=${AUTH}"
          } >> "$GITHUB_ENV"

      - name: Ensure Graph Mail.Send permission (native email)
        # Huddle sends email natively via Microsoft Graph (app-only). The deploy
        # service principal needs the Mail.Send APPLICATION permission. Try to grant
        # it programmatically; if the SP can't self-consent, warn with the one-time
        # manual step rather than failing the deploy.
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          GT=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          GRAPH_APPID="00000003-0000-0000-c000-000000000000"
          MAILSEND_ROLE="b633e1c5-b582-4048-a93e-9f11b44c7e96"  # Graph Mail.Send (application)
          spid() {
            curl -s -G "https://graph.microsoft.com/v1.0/servicePrincipals" \
              --data-urlencode "\$filter=appId eq '$1'" -H "Authorization: Bearer $GT" \
              | python3 -c 'import sys,json;a=json.load(sys.stdin).get("value",[]);print(a[0]["id"] if a else "")'
          }
          GRAPH_SP=$(spid "$GRAPH_APPID")
          MY_SP=$(spid "$AZURE_CLIENT_ID")
          if [ -z "$GRAPH_SP" ] || [ -z "$MY_SP" ]; then
            echo "::warning::Could not resolve service principals; skipping Mail.Send grant."; exit 0
          fi
          ALREADY=$(curl -s "https://graph.microsoft.com/v1.0/servicePrincipals/$MY_SP/appRoleAssignments" \
            -H "Authorization: Bearer $GT" \
            | python3 -c "import sys,json;print(any(a.get('appRoleId')=='$MAILSEND_ROLE' for a in json.load(sys.stdin).get('value',[])))")
          if [ "$ALREADY" = "True" ]; then echo "Mail.Send already granted."; exit 0; fi
          CODE=$(curl -s -o /tmp/grant.json -w '%{http_code}' -X POST \
            "https://graph.microsoft.com/v1.0/servicePrincipals/$MY_SP/appRoleAssignments" \
            -H "Authorization: Bearer $GT" -H "Content-Type: application/json" \
            -d "{\"principalId\":\"$MY_SP\",\"resourceId\":\"$GRAPH_SP\",\"appRoleId\":\"$MAILSEND_ROLE\"}")
          if [ "$CODE" = "201" ]; then
            echo "Granted Mail.Send (application) to the app."
          else
            echo "::warning::Could not auto-grant Mail.Send (HTTP $CODE). Grant it once in Entra: App registrations → the deploy app → API permissions → Add → Microsoft Graph → Application → Mail.Send → Grant admin consent. (Or give the deploy SP AppRoleAssignment.ReadWrite.All so this step can self-consent.)"
            cat /tmp/grant.json 2>/dev/null || true
          fi

      - name: Build (Azure Static Web Apps target)
        env:
          NITRO_PRESET: azure-swa
        run: |
          bun run build
          # Co-locate the generated SWA config with the static assets we upload.
          cp -f staticwebapp.config.json .output/public/ 2>/dev/null || true
          test -d .output/server || (echo "azure-swa build produced no server output" && exit 1)
          # Patch the generated SWA routing/runtime config. Two fixes:
          #  a. apiRuntime: Nitro sets node:22 (its build node), but SWA managed
          #     functions don't support Node 22 — the function won't start. Pin node:20.
          #  b. Route server-function calls to the SSR function. Nitro only wires
          #     `navigationFallback` (GET navigations) + an explicit `/` rewrite, so
          #     POST /_serverFn/* falls through to the static host and returns 405 —
          #     every server function (Settings, memory, batch, chat) fails. Add an
          #     explicit all-methods route for /_serverFn/* → the SSR function.
          python3 - <<'PY'
          import json, os
          for f in ("staticwebapp.config.json", ".output/public/staticwebapp.config.json"):
              if not os.path.exists(f):
                  continue
              c = json.load(open(f))
              c.setdefault("platform", {})["apiRuntime"] = "node:20"
              target = (c.get("navigationFallback") or {}).get("rewrite") or "/api/server"
              routes = c.setdefault("routes", [])
              if not any(r.get("route") == "/_serverFn/*" for r in routes):
                  routes.insert(0, {"route": "/_serverFn/*", "rewrite": target})
                  print("added /_serverFn/* ->", target, "route in", f)
              json.dump(c, open(f, "w"), indent=2)
              print("set apiRuntime=node:20 in", f)
          PY
          # The beta azure-swa handler (nitro 3.x beta) has three bugs that make
          # the SWA managed function unusable. Patch the generated handler in one
          # pass; each replacement asserts its anchor exists so a future Nitro
          # upgrade that changes the code shape fails the build loudly instead of
          # silently shipping a broken function. Remove once the stable preset ships.
          #   1. `new Request(url, ...)` uses a RELATIVE url ("/", "/api/...");
          #      Node's undici rejects it ("Failed to parse URL") and the function
          #      throws before writing a body → every request 500s. Give it an
          #      absolute base (routing only reads the pathname).
          #   2. The Request forwards NO request headers, so POST server-function
          #      calls arrive without Content-Type and TanStack can't parse the
          #      body → 500 on every server fn (Settings, memory, batch, chat).
          #      Forward the headers, minus content-length/content-encoding, which
          #      describe the ORIGINAL wire body and would corrupt the proxied one.
          #   3. `context.res.body = response.body` hands a ReadableStream to SWA's
          #      classic Functions worker, which serializes it to "{}" (HTTP 200,
          #      empty page). Buffer it first.
          ENTRY=.output/server/functions/index.mjs
          python3 - "$ENTRY" <<'PY'
          import sys
          f = sys.argv[1]
          s = o = open(f).read()
          def patch(src, old, new, label):
              if old not in src:
                  sys.stderr.write(f"ERROR: anchor for '{label}' not found — azure-swa preset changed; update deploy-swa.yml\n")
                  sys.exit(1)
              print("patched:", label)
              return src.replace(old, new, 1)
          s = patch(s, "new Request(url, {",
                    'new Request(new URL(url, "http://localhost"), {', "relative-URL Request")
          s = patch(s, "method: req.method || void 0,",
                    'method: req.method || void 0, headers: (()=>{const h={...req.headers};delete h["content-length"];delete h["content-encoding"];return h;})(),',
                    "forward request headers")
          s = patch(s, "body: response.body,",
                    "body: Buffer.from(await response.arrayBuffer()),", "buffer response body")
          open(f, "w").write(s)
          PY

      - name: Resolve database connection string
        # Prefer the full AZURE_PG_URL secret. If it's empty, assemble it from
        # parts entirely inside the workflow: discover the Postgres flexible
        # server (host, admin user, db) with the already-logged-in Azure SP, and
        # take the password from whichever admin-password secret is set. Also open
        # the DB firewall to Azure services, since the SWA managed function's
        # outbound IPs are dynamic. The assembled URL is masked and never printed.
        env:
          FULL_URL: ${{ secrets.AZURE_PG_URL }}
          # First non-empty password secret wins. AZURE_ADMIN_PW is the real one;
          # the rest are fallbacks in case it's ever renamed.
          PG_PW_1: ${{ secrets.AZURE_ADMIN_PW }}
          PG_PW_2: ${{ secrets.AZURE_PG_PASSWORD }}
          PG_PW_3: ${{ secrets.AZURE_POSTGRES_PASSWORD }}
          PG_PW_4: ${{ secrets.AZURE_PG_ADMIN_PASSWORD }}
          PG_PW_5: ${{ secrets.PG_ADMIN_PASSWORD }}
          PG_PW_6: ${{ secrets.POSTGRES_PASSWORD }}
          # PINNED to the canonical Huddle database. Deploy-time discovery previously took the first
          # server it found (servers[0]) with no pin; when a second server (ux-design-pg) appeared it
          # started winning, and the app got mis-wired to ux-design-pg/postgres (a bare DB with no
          # memory tables) — the root cause of the "memory switched DBs between sessions" bug. Pinning
          # here makes every deploy target eds-postgresql/RAG_AI_Agents. A secret still overrides if set.
          PG_SERVER_OVERRIDE: ${{ secrets.AZURE_PG_SERVER || 'eds-postgresql' }}
          PG_DB_OVERRIDE: ${{ secrets.AZURE_PG_DB || 'RAG_AI_Agents' }}
        run: |
          set -euo pipefail
          if [ -n "${FULL_URL}" ]; then
            echo "::add-mask::${FULL_URL}"
            echo "AZURE_PG_URL_RESOLVED=${FULL_URL}" >> "$GITHUB_ENV"
            echo "Using AZURE_PG_URL secret as-is."
            exit 0
          fi
          echo "AZURE_PG_URL empty — assembling from parts via az discovery."
          SERVERS=$(az postgres flexible-server list -o json)
          read -r SRV RG HOST ADMIN < <(python3 - "$SERVERS" "${PG_SERVER_OVERRIDE:-}" <<'PY'
          import sys, json
          servers = json.loads(sys.argv[1] or "[]")
          override = sys.argv[2]
          if not servers:
              sys.stderr.write("No Azure PostgreSQL flexible server found in the subscription.\n")
              sys.exit(3)
          s = next((x for x in servers if x.get("name") == override), servers[0]) if override else servers[0]
          print(s["name"], s["resourceGroup"], s["fullyQualifiedDomainName"], s.get("administratorLogin", "pgadmin"))
          PY
          )
          echo "Discovered server '$SRV' (rg=$RG, host=$HOST, admin=$ADMIN)."
          # Pick the database: override, else first non-system db, else 'postgres'.
          if [ -n "${PG_DB_OVERRIDE:-}" ]; then
            DB="$PG_DB_OVERRIDE"
          else
            DBS=$(az postgres flexible-server db list -g "$RG" -s "$SRV" -o json 2>/dev/null || echo '[]')
            DB=$(python3 -c 'import sys,json; sysdb={"azure_maintenance","azure_sys"}; xs=[d["name"] for d in json.loads(sys.argv[1]) if d.get("name") not in sysdb and d.get("name")!="postgres"]; print(xs[0] if xs else "postgres")' "$DBS")
          fi
          echo "Using database '$DB'."
          # Password from the first non-empty candidate secret.
          PW=""
          for c in "$PG_PW_1" "$PG_PW_2" "$PG_PW_3" "$PG_PW_4" "$PG_PW_5" "$PG_PW_6"; do
            if [ -n "$c" ]; then PW="$c"; break; fi
          done
          if [ -z "$PW" ]; then
            echo "::error::No Postgres admin-password secret set. Tried AZURE_ADMIN_PW, AZURE_PG_PASSWORD, AZURE_POSTGRES_PASSWORD, AZURE_PG_ADMIN_PASSWORD, PG_ADMIN_PASSWORD, POSTGRES_PASSWORD. Set one (or set AZURE_PG_URL directly)."
            exit 1
          fi
          echo "::add-mask::$PW"
          # Allow Azure-hosted services (the SWA function) through the DB firewall. Idempotent.
          az postgres flexible-server firewall-rule create -g "$RG" -n "$SRV" \
            --rule-name AllowAzureServices --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0 \
            --only-show-errors >/dev/null 2>&1 && echo "Ensured 'Allow Azure services' firewall rule." || echo "Firewall rule step skipped/failed (may already exist)."
          # URL-encode user + password, then assemble.
          EADMIN=$(python3 -c 'import sys,urllib.parse as u; print(u.quote(sys.argv[1], safe=""))' "$ADMIN")
          EPW=$(python3 -c 'import sys,urllib.parse as u; print(u.quote(sys.argv[1], safe=""))' "$PW")
          URL="postgresql://${EADMIN}:${EPW}@${HOST}:5432/${DB}?sslmode=require"
          echo "::add-mask::$URL"
          echo "AZURE_PG_URL_RESOLVED=${URL}" >> "$GITHUB_ENV"
          echo "Assembled AZURE_PG_URL for $SRV/$DB."

      - name: Sync secrets → SWA app settings
        run: |
          if [ -z "${AZURE_PG_URL_RESOLVED:-}" ]; then
            echo "::error::AZURE_PG_URL_RESOLVED is empty — database not configured; aborting so the app isn't deployed half-wired."
            exit 1
          fi
          az staticwebapp appsettings set --name "$SWA_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --only-show-errors --setting-names \
              ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}" \
              ELEVENLABS_DEFAULT_VOICE_ID="${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}" \
              ELEVENLABS_AGENT_LLM="${{ secrets.ELEVENLABS_AGENT_LLM }}" \
              OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              LOVABLE_API_KEY="${{ secrets.LOVABLE_API_KEY }}" \
              TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}" \
              AZURE_PG_URL="${AZURE_PG_URL_RESOLVED}" \
              JOURNEY_PROXY_URL="${{ secrets.JOURNEY_PROXY_URL || 'https://wwxgajrtmslzklnyplah.supabase.co/functions/v1/huddle-proxy' }}" \
              JOURNEY_PROXY_TOKEN="${{ secrets.JOURNEY_PROXY_TOKEN }}" \
              VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
              VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}" \
              VAPID_SUBJECT="${{ secrets.VAPID_SUBJECT || 'mailto:dev@enterpriseds.io' }}" \
              ENTRA_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
              ENTRA_CLIENT_ID="${ENTRA_CLIENT_ID_RESOLVED:-${{ secrets.ENTRA_CLIENT_ID }}}" \
              ENTRA_AUTHORITY="${ENTRA_AUTHORITY_RESOLVED:-${{ secrets.VITE_ENTRA_AUTHORITY }}}" \
              AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
              AZURE_CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
              AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
              HUDDLE_EMAIL_FROM="${{ secrets.HUDDLE_EMAIL_FROM || 'dev@enterpriseds.io,von.ellis@enterpriseds.io' }}" \
              HUDDLE_APP_URL="https://${SWA_HOST}"

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ".output/public"
          api_location: ".output/server"
          skip_app_build: true
          skip_api_build: true

      - name: Report
        run: |
          echo "## Huddle on Static Web Apps" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://${SWA_HOST}" >> "$GITHUB_STEP_SUMMARY"
