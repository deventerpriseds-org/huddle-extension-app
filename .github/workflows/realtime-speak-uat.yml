name: Realtime-speak Fast (A) UAT

# Batch-of-agents UAT for Approach A EL-VOICE HYBRID (OpenAI Realtime = streaming TEXT brain over the
# WebRTC data channel; the client voices each streamed sentence via ElevenLabs → HTMLAudioElement).
# Loads the DEPLOYED SWA in headless Chromium (fake mic), seeds Fast (A), connects, TYPES each agent's
# daily ask, and proves it spoke via the HYBRID signals (streamed response.output_text delta/.done on the
# data channel, OR HTMLMediaElement.play() of EL audio, OR a synthesizeSpeech /_serverFn/ call) — NOT
# inbound-rtp audio bytes (a text-out session has no OpenAI audio track; bytes are EXPECTED 0). Captures
# the ACTUAL streamed reply text (not pre-existing cards), classifies against the poor-response taxonomy,
# and uploads per-step screenshots as the proof artifact.

on:
  workflow_dispatch:

jobs:
  realtime-speak-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run realtime-speak UAT
        env:
          APP_URL: https://icy-flower-0f415200f.7.azurestaticapps.net
          UAT_BYPASS_TOKEN: ${{ secrets.UAT_BYPASS_TOKEN }}
          SHOT_DIR: uat-shots
        run: node e2e/realtime-speak-uat.e2e.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-speak-uat-shots
          path: uat-shots/
          retention-days: 7
