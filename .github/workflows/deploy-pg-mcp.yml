name: Deploy read-only Postgres MCP (Azure Container Apps)

# ONE-TIME / on-demand provisioner for a runner-free way to query the Huddle Azure PG
# (eds-postgresql / RAG_AI_Agents) from a Claude Code session. It stands up a read-only
# `crystaldba/postgres-mcp` behind a `caddy` bearer-auth sidecar on Azure Container Apps.
# The MCP is then registered in claude.ai as a REMOTE connector (brokered by Anthropic, so it
# bypasses the session egress that blocks Azure hosts) — after which queries need NO GitHub runner.
#
# Security: (a) dedicated LOGIN role `mcp_readonly` granted only `pg_read_all_data`; (b) crystaldba
# `--access-mode=restricted` (read-only txns); (c) caddy requires `Authorization: Bearer <JOURNEY_PROXY_TOKEN>`
# on every request. PG stays private — ACA runs inside Azure and reaches PG via the "Allow Azure services" rule.

on:
  workflow_dispatch:
    inputs:
      db:
        description: "Database to expose (read-only)."
        default: "RAG_AI_Agents"
      ro_role:
        description: "Read-only role name."
        default: "mcp_readonly"

env:
  RG: EnterpriseDS_ResourceGRP
  PG_SERVER: eds-postgresql
  ACA_ENV: eds-mcp-env
  ACA_APP: huddle-pg-mcp
  LOCATION: eastus

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (service principal)
        run: |
          az login --service-principal -u "${{ secrets.AZURE_CLIENT_ID }}" \
            -p "${{ secrets.AZURE_CLIENT_SECRET }}" --tenant "${{ secrets.AZURE_TENANT_ID }}" >/dev/null
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null 2>&1 || true

      - name: Ensure PG allows Azure services (so ACA can reach it, PG stays private)
        run: |
          az postgres flexible-server firewall-rule create -g "$RG" -s "$PG_SERVER" \
            --rule-name AllowAllAzureServices --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0 \
            --only-show-errors >/dev/null || echo "rule exists"

      - name: Create / refresh read-only role
        env:
          PGPASSWORD: ${{ secrets.Azure_admin_pw }}
        run: |
          set -euo pipefail
          RO_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$RO_PW"
          echo "RO_PW=$RO_PW" >> "$GITHUB_ENV"
          IP=$(curl -s https://api.ipify.org || curl -s https://checkip.amazonaws.com | tr -d '\n')
          # Best-effort: some az builds on the runner reject --rule-name here. Don't hard-fail — the
          # server already has firewall rules that admit runners + Azure services (same as azure-pg-query.yml,
          # which relies on this and connects fine). psql below still runs; if it truly can't connect, THAT fails.
          az postgres flexible-server firewall-rule create -g "$RG" -s "$PG_SERVER" \
            --rule-name "mcpdeploy-${IP//./-}" --start-ip-address "$IP" --end-ip-address "$IP" --only-show-errors >/dev/null 2>&1 \
            || echo "firewall-rule create skipped — relying on existing server rules"
          HOST="$PG_SERVER.postgres.database.azure.com"
          psql "host=$HOST port=5432 dbname=${{ github.event.inputs.db }} user=Admin_eds sslmode=require" \
            -v ON_ERROR_STOP=1 -v role="${{ github.event.inputs.ro_role }}" -v pw="$RO_PW" <<'SQL'
          SELECT format('CREATE ROLE %I LOGIN', :'role')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
          SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'pw') \gexec
          SELECT format('GRANT pg_read_all_data TO %I', :'role') \gexec
          SQL
          az postgres flexible-server firewall-rule delete -g "$RG" -s "$PG_SERVER" \
            --rule-name "mcpdeploy-${IP//./-}" --yes --only-show-errors >/dev/null || true

      - name: Ensure Container Apps environment
        run: |
          az containerapp env show -g "$RG" -n "$ACA_ENV" --only-show-errors >/dev/null 2>&1 || \
          az containerapp env create -g "$RG" -n "$ACA_ENV" -l "$LOCATION" --only-show-errors >/dev/null

      - name: Deploy the MCP app (postgres-mcp, no-auth — Option A)
        run: |
          set -euo pipefail
          ENV_ID=$(az containerapp env show -g "$RG" -n "$ACA_ENV" --query id -o tsv)
          DB_URI="postgresql://${{ github.event.inputs.ro_role }}:${RO_PW}@${PG_SERVER}.postgres.database.azure.com:5432/${{ github.event.inputs.db }}?sslmode=require"
          # OPTION A (no auth): ingress points straight at the read-only MCP on :8000 — no caddy/bearer,
          # because claude.ai custom connectors speak OAuth or no-auth, not a static bearer header. Security
          # rests on the unguessable ACA URL + the read-only `mcp_readonly` role (no writes possible).
          # Option B (OAuth in front) is the planned hardening; this proves the pipeline end-to-end first.
          cat > app.yaml <<YAML
          properties:
            managedEnvironmentId: ${ENV_ID}
            configuration:
              activeRevisionsMode: Single
              ingress:
                external: true
                targetPort: 8000
                transport: auto
                allowInsecure: false
              secrets:
                - name: db-uri
                  value: "${DB_URI}"
            template:
              scale: { minReplicas: 1, maxReplicas: 1 }
              containers:
                - name: pgmcp
                  image: crystaldba/postgres-mcp:latest
                  args: ["--access-mode=restricted", "--transport=sse"]
                  resources: { cpu: 0.5, memory: 1.0Gi }
                  env:
                    - name: DATABASE_URI
                      secretRef: db-uri
          YAML
          if az containerapp show -g "$RG" -n "$ACA_APP" --only-show-errors >/dev/null 2>&1; then
            az containerapp update -g "$RG" -n "$ACA_APP" --yaml app.yaml --only-show-errors >/dev/null
          else
            az containerapp create -g "$RG" -n "$ACA_APP" --yaml app.yaml --only-show-errors >/dev/null
          fi

      - name: Output the connector URL
        run: |
          FQDN=$(az containerapp show -g "$RG" -n "$ACA_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "============================================================"
          echo "MCP is deployed (no-auth / Option A). Register in claude.ai -> Settings -> Connectors -> Add custom connector:"
          echo "  URL:  https://${FQDN}/sse"
          echo "  Auth: leave Advanced settings BLANK (no OAuth, no token)"
          echo "============================================================"
          # Quick health probe from the runner (which CAN reach the ACA host, unlike the session).
          echo "--- health probe ---"
          curl -sS -m 15 -o /dev/null -w "GET /sse -> HTTP %{http_code}\n" "https://${FQDN}/sse" || echo "probe failed"
