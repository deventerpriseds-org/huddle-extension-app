name: Deploy read-only Postgres MCP (Azure Container Apps)

# Runner-free way to query the Huddle Azure PG (eds-postgresql / RAG_AI_Agents) from a Claude Code
# session, via a REMOTE MCP connector (brokered by Anthropic → bypasses the session egress that blocks
# Azure hosts). OPTION B (OAuth): claude.ai custom connectors require OAuth + Dynamic Client Registration,
# which crystaldba lacks and Entra can't provide (no DCR). So we front crystaldba with the
# obot-platform/mcp-oauth-proxy (it IS the OAuth server Claude needs: DCR + discovery + token mint) and
# delegate LOGIN to Google (reusing the existing GOOGLE_CLIENT_ID/SECRET org secrets — no new app/secret).
#
# Topology (single ACA app, two containers sharing localhost):
#   internet --HTTPS--> obot (external ingress :8080, OAuth) --localhost:8000--> crystaldba (internal, read-only)
# Security: crystaldba is never public; obot 401s everything until a Google-authenticated OAuth token is
# presented; the DB role `mcp_readonly` has only pg_read_all_data; crystaldba runs --access-mode=restricted.

on:
  workflow_dispatch:
    inputs:
      db:
        description: "Database to expose (read-only)."
        default: "RAG_AI_Agents"
      ro_role:
        description: "Read-only role name."
        default: "mcp_readonly"

env:
  RG: EnterpriseDS_ResourceGRP
  PG_SERVER: eds-postgresql
  ACA_ENV: eds-mcp-env
  ACA_APP: huddle-pg-mcp
  LOCATION: eastus

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (service principal)
        run: |
          az login --service-principal -u "${{ secrets.AZURE_CLIENT_ID }}" \
            -p "${{ secrets.AZURE_CLIENT_SECRET }}" --tenant "${{ secrets.AZURE_TENANT_ID }}" >/dev/null
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null 2>&1 || true

      - name: Ensure PG allows Azure services (so ACA can reach it, PG stays private)
        run: |
          az postgres flexible-server firewall-rule create -g "$RG" -s "$PG_SERVER" \
            --rule-name AllowAllAzureServices --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0 \
            --only-show-errors >/dev/null 2>&1 || echo "allow-azure rule already present / flag rejected"

      - name: Provision read-only role + obot OAuth store
        env:
          PGPASSWORD: ${{ secrets.Azure_admin_pw }}
        run: |
          set -euo pipefail
          RO_PW="$(openssl rand -hex 24)";   echo "::add-mask::$RO_PW";   echo "RO_PW=$RO_PW" >> "$GITHUB_ENV"
          OBOT_PW="$(openssl rand -hex 24)"; echo "::add-mask::$OBOT_PW"; echo "OBOT_PW=$OBOT_PW" >> "$GITHUB_ENV"
          IP=$(curl -s https://api.ipify.org || curl -s https://checkip.amazonaws.com | tr -d '\n')
          az postgres flexible-server firewall-rule create -g "$RG" -s "$PG_SERVER" \
            --rule-name "mcpdeploy-${IP//./-}" --start-ip-address "$IP" --end-ip-address "$IP" --only-show-errors >/dev/null 2>&1 \
            || echo "firewall-rule create skipped — relying on existing server rules"
          HOST="$PG_SERVER.postgres.database.azure.com"
          # (1) read-only role for crystaldba, in the target DB
          psql "host=$HOST port=5432 dbname=${{ github.event.inputs.db }} user=Admin_eds sslmode=require" \
            -v ON_ERROR_STOP=1 -v role="${{ github.event.inputs.ro_role }}" -v pw="$RO_PW" <<'SQL'
          SELECT format('CREATE ROLE %I LOGIN', :'role') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
          SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'pw') \gexec
          SELECT format('GRANT pg_read_all_data TO %I', :'role') \gexec
          SQL
          # (2) obot's OWN read-write store (separate role + database), created from the 'postgres' db
          psql "host=$HOST port=5432 dbname=postgres user=Admin_eds sslmode=require" \
            -v ON_ERROR_STOP=1 -v pw="$OBOT_PW" <<'SQL'
          SELECT format('CREATE ROLE obot LOGIN PASSWORD %L', :'pw') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'obot') \gexec
          SELECT format('ALTER ROLE obot PASSWORD %L', :'pw') \gexec
          SELECT 'CREATE DATABASE obot_oauth OWNER obot' WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'obot_oauth') \gexec
          SQL
          # (3) PG15+: DB owner still lacks CREATE on schema public — grant it so obot can auto-migrate.
          psql "host=$HOST port=5432 dbname=obot_oauth user=Admin_eds sslmode=require" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SCHEMA public OWNER TO obot;
          GRANT ALL ON SCHEMA public TO obot;
          SQL
          az postgres flexible-server firewall-rule delete -g "$RG" -s "$PG_SERVER" \
            --rule-name "mcpdeploy-${IP//./-}" --yes --only-show-errors >/dev/null 2>&1 || true

      - name: Ensure Container Apps environment
        run: |
          az containerapp env show -g "$RG" -n "$ACA_ENV" --only-show-errors >/dev/null 2>&1 || \
          az containerapp env create -g "$RG" -n "$ACA_ENV" -l "$LOCATION" --only-show-errors >/dev/null

      - name: Deploy obot OAuth proxy + read-only crystaldba MCP (Option B)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JPT: ${{ secrets.JOURNEY_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          ENV_ID=$(az containerapp env show -g "$RG" -n "$ACA_ENV" --query id -o tsv)
          RO_DSN="postgresql://${{ github.event.inputs.ro_role }}:${RO_PW}@${PG_SERVER}.postgres.database.azure.com:5432/${{ github.event.inputs.db }}?sslmode=require"
          OBOT_DSN="postgres://obot:${OBOT_PW}@${PG_SERVER}.postgres.database.azure.com:5432/obot_oauth?sslmode=require"
          # Stable AES-256 key derived from an existing org secret → survives redeploys (no re-auth), no new secret.
          ENC_KEY=$(printf '%s' "${JPT}::obot-mcp-enc-v1" | sha256sum | cut -d' ' -f1 | xxd -r -p | base64 -w0)
          # Changing nonce → new revision hash EVERY deploy, so the container actually RESTARTS.
          # (A secret-value change alone — e.g. the rotated OBOT_PW — does NOT bump the revision hash in
          #  Single mode, so obot would keep running its pre-grant crash-looped replica and never retry
          #  auto-migrate. This forces a clean restart AFTER the schema grant + password reset are applied.)
          NONCE=$(date +%s)
          cat > app.yaml <<YAML
          properties:
            managedEnvironmentId: ${ENV_ID}
            configuration:
              activeRevisionsMode: Single
              ingress:
                external: true
                targetPort: 8080
                transport: auto
                allowInsecure: false
              secrets:
                - name: ro-dsn
                  value: "${RO_DSN}"
                - name: obot-dsn
                  value: "${OBOT_DSN}"
                - name: google-secret
                  value: "${GOOGLE_CLIENT_SECRET}"
                - name: enc-key
                  value: "${ENC_KEY}"
            template:
              scale: { minReplicas: 1, maxReplicas: 1 }
              containers:
                - name: pgmcp
                  image: crystaldba/postgres-mcp:latest
                  args: ["--access-mode=restricted", "--transport=sse"]
                  resources: { cpu: 0.5, memory: 1.0Gi }
                  env:
                    - name: DATABASE_URI
                      secretRef: ro-dsn
                - name: oauth
                  image: ghcr.io/obot-platform/mcp-oauth-proxy:latest
                  resources: { cpu: 0.25, memory: 0.5Gi }   # total with pgmcp = 0.75 CPU / 1.5Gi (a valid ACA combo)
                  env:
                    - name: DEPLOY_NONCE
                      value: "${NONCE}"
                    - name: HOST
                      value: "0.0.0.0"
                    - name: PORT
                      value: "8080"
                    - name: OAUTH_CLIENT_ID
                      value: "${GOOGLE_CLIENT_ID}"
                    - name: OAUTH_CLIENT_SECRET
                      secretRef: google-secret
                    - name: OAUTH_AUTHORIZE_URL
                      value: "https://accounts.google.com"
                    - name: SCOPES_SUPPORTED
                      value: "openid,profile,email"
                    - name: MCP_SERVER_URL
                      value: "http://localhost:8000"
                    - name: ENCRYPTION_KEY
                      secretRef: enc-key
                    - name: DATABASE_DSN
                      secretRef: obot-dsn
          YAML
          if az containerapp show -g "$RG" -n "$ACA_APP" --only-show-errors >/dev/null 2>&1; then
            az containerapp update -g "$RG" -n "$ACA_APP" --yaml app.yaml --only-show-errors >/dev/null
          else
            az containerapp create -g "$RG" -n "$ACA_APP" --yaml app.yaml --only-show-errors >/dev/null
          fi

      - name: Verify OAuth endpoints + output connector URL
        run: |
          FQDN=$(az containerapp show -g "$RG" -n "$ACA_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "============================================================"
          echo "Connector URL (claude.ai -> Add custom connector, leave Advanced BLANK):"
          echo "  https://${FQDN}/sse"
          echo "Google OAuth client redirect URI to authorize (add in Google Cloud Console):"
          echo "  https://${FQDN}/callback"
          echo "============================================================"
          echo "--- Wait for the new revision to reach a terminal running state ---"
          LATEST=$(az containerapp revision list -g "$RG" -n "$ACA_APP" --query "reverse(sort_by([].{n:name,t:properties.createdTime},&t))[0].n" -o tsv)
          echo "Newest revision: $LATEST"
          for i in $(seq 1 20); do
            STATE=$(az containerapp revision show -g "$RG" -n "$ACA_APP" --revision "$LATEST" --query properties.runningState -o tsv 2>/dev/null || echo "?")
            echo "  [$i] runningState=$STATE"
            case "$STATE" in Healthy|Running|Failed|Degraded) break;; esac
            sleep 10
          done
          echo "--- obot container logs (auto-migrate outcome) ---"
          az containerapp logs show -g "$RG" -n "$ACA_APP" --container oauth --revision "$LATEST" --tail 40 2>&1 | tail -40 || echo "(oauth logs unavailable)"
          echo "--- OAuth discovery + gating probes (from the runner) ---"
          curl -sS -m 20 -o /dev/null -w "PRM   /.well-known/oauth-protected-resource/sse -> HTTP %{http_code} (want 200)\n" "https://${FQDN}/.well-known/oauth-protected-resource/sse" || echo "PRM probe failed"
          curl -sS -m 20 -o /dev/null -w "AS    /.well-known/oauth-authorization-server   -> HTTP %{http_code} (want 200)\n" "https://${FQDN}/.well-known/oauth-authorization-server" || echo "AS probe failed"
          curl -sS -m 20 -o /dev/null -w "GATE  /sse (unauth)                             -> HTTP %{http_code} (want 401)\n" "https://${FQDN}/sse" || echo "gate probe failed"
