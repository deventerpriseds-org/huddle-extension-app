name: Verify Reverse-Clear (one-shot)

# One-shot verification that the journey→Huddle blocked-status reverse-clear works: a task that
# syncs in with a NON-BLOCKED status clears its Huddle-native task_blockers row (so unblocking on
# journey stops Huddle surfacing it as blocked), guarded on the incoming updated_at so a stale/out-
# of-order sync can't wipe a just-written blocker. Drives the REAL webhook (POST /api/public/tasks-sync
# → upsertJourneyTask) with the shared JOURNEY_PROXY_TOKEN, against a SYNTHETIC task it seeds and
# cleans up — never touches real board data. Ops workflow; remove after use (cleanup-test-tasks.yml
# precedent). Mirrors azure-pg-query.yml for the Azure login + firewall + psql plumbing.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Deployed SWA base URL"
        required: false
        default: "https://icy-flower-0f415200f.7.azurestaticapps.net"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SYNTH_ID: "00000000-0000-4000-8000-0000000cad00"
      SYNTH_EMAIL: "verify-reverse-clear@test.invalid"
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Resolve connection string (mirrors deploy-swa)
        env:
          FULL_URL: ${{ secrets.AZURE_PG_URL }}
          PG_PW_1: ${{ secrets.AZURE_ADMIN_PW }}
          PG_PW_2: ${{ secrets.AZURE_PG_PASSWORD }}
          PG_PW_3: ${{ secrets.AZURE_POSTGRES_PASSWORD }}
          PG_PW_4: ${{ secrets.AZURE_PG_ADMIN_PASSWORD }}
          PG_PW_5: ${{ secrets.PG_ADMIN_PASSWORD }}
          PG_PW_6: ${{ secrets.POSTGRES_PASSWORD }}
          PG_SERVER_OVERRIDE: ${{ secrets.AZURE_PG_SERVER || 'eds-postgresql' }}
          PG_DB_OVERRIDE: ${{ secrets.AZURE_PG_DB || 'RAG_AI_Agents' }}
        run: |
          set -euo pipefail
          if [ -n "${FULL_URL}" ]; then
            echo "::add-mask::${FULL_URL}"
            echo "AZURE_PG_URL_RESOLVED=${FULL_URL}" >> "$GITHUB_ENV"
            HOST=$(python3 -c 'import sys,urllib.parse as u;print(u.urlparse(sys.argv[1]).hostname or "")' "$FULL_URL")
            SRV=$(echo "$HOST" | cut -d. -f1)
            RG=$(az postgres flexible-server list -o json | python3 -c 'import sys,json;xs=json.load(sys.stdin);s=sys.argv[1];print(next((x["resourceGroup"] for x in xs if x.get("name")==s), ""))' "$SRV")
            echo "PG_RG=$RG" >> "$GITHUB_ENV"; echo "PG_SRV=$SRV" >> "$GITHUB_ENV"
            echo "Using AZURE_PG_URL secret as-is (server=$SRV rg=$RG)."
            exit 0
          fi
          echo "AZURE_PG_URL empty — assembling from parts via az discovery."
          SERVERS=$(az postgres flexible-server list -o json)
          read -r SRV RG HOST ADMIN < <(python3 - "$SERVERS" "${PG_SERVER_OVERRIDE:-}" <<'PY'
          import sys, json
          servers = json.loads(sys.argv[1] or "[]")
          override = sys.argv[2]
          if not servers:
              sys.stderr.write("No Azure PostgreSQL flexible server found.\n"); sys.exit(3)
          s = next((x for x in servers if x.get("name") == override), servers[0]) if override else servers[0]
          print(s["name"], s["resourceGroup"], s["fullyQualifiedDomainName"], s.get("administratorLogin", "pgadmin"))
          PY
          )
          if [ -n "${PG_DB_OVERRIDE:-}" ]; then DB="$PG_DB_OVERRIDE"; else
            DBS=$(az postgres flexible-server db list -g "$RG" -s "$SRV" -o json 2>/dev/null || echo '[]')
            DB=$(python3 -c 'import sys,json; sysdb={"azure_maintenance","azure_sys"}; xs=[d["name"] for d in json.loads(sys.argv[1]) if d.get("name") not in sysdb and d.get("name")!="postgres"]; print(xs[0] if xs else "postgres")' "$DBS")
          fi
          PW=""
          for c in "$PG_PW_1" "$PG_PW_2" "$PG_PW_3" "$PG_PW_4" "$PG_PW_5" "$PG_PW_6"; do
            if [ -n "$c" ]; then PW="$c"; break; fi
          done
          if [ -z "$PW" ]; then echo "::error::No Postgres admin-password secret set."; exit 1; fi
          echo "::add-mask::$PW"
          EADMIN=$(python3 -c 'import sys,urllib.parse as u; print(u.quote(sys.argv[1], safe=""))' "$ADMIN")
          EPW=$(python3 -c 'import sys,urllib.parse as u; print(u.quote(sys.argv[1], safe=""))' "$PW")
          URL="postgresql://${EADMIN}:${EPW}@${HOST}:5432/${DB}?sslmode=require"
          echo "::add-mask::$URL"
          echo "AZURE_PG_URL_RESOLVED=${URL}" >> "$GITHUB_ENV"
          echo "PG_RG=$RG" >> "$GITHUB_ENV"; echo "PG_SRV=$SRV" >> "$GITHUB_ENV"
          echo "Assembled AZURE_PG_URL for $SRV/$DB (rg=$RG)."

      - name: Allow this runner through the DB firewall
        run: |
          set -euo pipefail
          IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me)
          RULE="ghverify-${IP//./-}"
          echo "FW_RULE=$RULE" >> "$GITHUB_ENV"
          az postgres flexible-server firewall-rule create -g "$PG_RG" -s "$PG_SRV" \
            --rule-name "$RULE" --start-ip-address "$IP" --end-ip-address "$IP" --only-show-errors >/dev/null 2>&1 \
            && echo "Opened firewall rule $RULE for $IP." \
            || echo "firewall-rule create skipped (relying on existing server rules)."
          sleep 8

      - name: Run reverse-clear verification
        env:
          BASE: ${{ github.event.inputs.base }}
          TOKEN: ${{ secrets.JOURNEY_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PSQL() { psql "$AZURE_PG_URL_RESOLVED" -v ON_ERROR_STOP=1 --pset pager=off -tAc "$1"; }
          if [ -z "${TOKEN}" ]; then echo "::error::JOURNEY_PROXY_TOKEN not set"; exit 1; fi

          # Seed a synthetic task + blocker. Task's old updated_at is 2h ago; blocker flagged 1h ago.
          seed() {
            PSQL "DELETE FROM tasks.task_blockers WHERE task_id='${SYNTH_ID}';
                  DELETE FROM tasks.journey_tasks WHERE id='${SYNTH_ID}';
                  INSERT INTO tasks.journey_tasks (id,user_email,title,status,updated_at,created_at,synced_at)
                    VALUES ('${SYNTH_ID}','${SYNTH_EMAIL}','VERIFY reverse-clear','BLOCKED', now()-interval '2 hours', now()-interval '2 hours', now());
                  INSERT INTO tasks.task_blockers (task_id,user_email,reason,agent_id,flagged_at)
                    VALUES ('${SYNTH_ID}','${SYNTH_EMAIL}','synthetic blocker','terry-locke', now()-interval '1 hour');" >/dev/null
          }
          blockers() { PSQL "SELECT count(*) FROM tasks.task_blockers WHERE task_id='${SYNTH_ID}';"; }
          mstatus() { PSQL "SELECT status FROM tasks.journey_tasks WHERE id='${SYNTH_ID}';"; }
          post() { # $1=status  $2=updated_at ISO
            curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "${BASE%/}/api/public/tasks-sync" \
              -H "x-webhook-secret: ${TOKEN}" -H "Content-Type: application/json" \
              -d "{\"operation\":\"UPDATE\",\"user_email\":\"${SYNTH_EMAIL}\",\"task\":{\"id\":\"${SYNTH_ID}\",\"title\":\"VERIFY reverse-clear\",\"status\":\"$1\",\"updated_at\":\"$2\",\"user_email\":\"${SYNTH_EMAIL}\"}}"
          }
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          STALE=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          FAIL=0
          echo "=================== REVERSE-CLEAR VERIFICATION ==================="

          # AC-1 (main): non-BLOCKED sync newer than the blocker CLEARS it.
          seed
          echo "AC-1 setup: blockers before = $(blockers) (expect 1)"
          HTTP=$(post "TODO" "$NOW"); echo "AC-1 webhook http=$HTTP resp=$(cat /tmp/resp.json)"
          B=$(blockers); S=$(mstatus)
          if [ "$HTTP" = "200" ] && [ "$B" = "0" ] && [ "$S" = "TODO" ]; then
            echo "AC-1 PASS: TODO sync cleared the blocker (blockers=$B, mirror status=$S)"
          else echo "AC-1 FAIL: http=$HTTP blockers=$B (want 0) status=$S (want TODO)"; FAIL=1; fi

          # AC-2 (guard): a BLOCKED sync must NOT clear the blocker (forward direction untouched).
          seed
          HTTP=$(post "BLOCKED" "$NOW"); B=$(blockers); S=$(mstatus)
          if [ "$HTTP" = "200" ] && [ "$B" = "1" ] && [ "$S" = "BLOCKED" ]; then
            echo "AC-2 PASS: BLOCKED sync left the blocker intact (blockers=$B, mirror status=$S)"
          else echo "AC-2 FAIL: http=$HTTP blockers=$B (want 1) status=$S (want BLOCKED)"; FAIL=1; fi

          # AC-3 (guard): a stale (older-than-flagged) non-BLOCKED sync must NOT clear a fresh blocker.
          seed
          HTTP=$(post "TODO" "$STALE"); B=$(blockers); S=$(mstatus)
          if [ "$HTTP" = "200" ] && [ "$B" = "1" ]; then
            echo "AC-3 PASS: stale TODO sync did NOT wipe the fresh blocker (blockers=$B, mirror status=$S)"
          else echo "AC-3 FAIL: http=$HTTP blockers=$B (want 1) status=$S"; FAIL=1; fi

          # Cleanup synthetic rows.
          PSQL "DELETE FROM tasks.task_blockers WHERE task_id='${SYNTH_ID}';
                DELETE FROM tasks.journey_tasks WHERE id='${SYNTH_ID}';" >/dev/null
          echo "Cleaned up synthetic rows."
          echo "=================== RESULT: $([ $FAIL -eq 0 ] && echo ALL-PASS || echo HAS-FAILURES) ==================="
          exit $FAIL

      - name: Remove the runner firewall rule
        if: always() && env.FW_RULE != ''
        run: |
          az postgres flexible-server firewall-rule delete -g "$PG_RG" -s "$PG_SRV" \
            --rule-name "$FW_RULE" --yes --only-show-errors >/dev/null 2>&1 && echo "Removed $FW_RULE." || echo "Cleanup skipped."
