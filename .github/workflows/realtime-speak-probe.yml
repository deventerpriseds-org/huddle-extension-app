name: realtime-speak-probe

# PREMISE PROBE (diagnostic-only). Confirms OpenAI GA `gpt-realtime` will speak directly over WebRTC
# AND execute a tool + speak the real result, in a real (headless) browser — BEFORE the multi-file
# 1:1 realtime-voice build. Runs on a GH runner (open internet; the CCR session can't reach
# api.openai.com's realtime WebRTC). Mints an ephemeral key from OPENAI_API_KEY (org secret), then
# drives one text turn + one tool round-trip. Delete once the premise is settled.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Realtime model to probe"
        required: false
        default: "gpt-realtime"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          npm i -D playwright@latest
          npx playwright install chromium
      - name: Mint ephemeral Realtime key
        id: mint
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY secret not set"; exit 1; fi
          resp=$(curl -sS -X POST https://api.openai.com/v1/realtime/client_secrets \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"session\":{\"type\":\"realtime\",\"model\":\"${MODEL}\"}}")
          ek=$(echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('value') or (d.get('client_secret') or {}).get('value') or '')")
          if [ -z "$ek" ]; then echo "mint failed: $(echo "$resp" | head -c 400)"; exit 1; fi
          echo "::add-mask::$ek"
          echo "ek=$ek" >> "$GITHUB_OUTPUT"
          echo "Ephemeral key minted (masked)."
      - name: Run speak+tool probe
        env:
          REALTIME_EK: ${{ steps.mint.outputs.ek }}
          REALTIME_MODEL: ${{ github.event.inputs.model }}
        run: node e2e/realtime-speak-probe.mjs
