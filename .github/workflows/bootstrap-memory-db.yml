# One-shot maintenance: allow-list the pgvector extension on the Azure Postgres Flexible Server.
#
# Why this exists: the memory/RAG store (rag_chunks / rag_triples) needs the `vector` extension. On
# Azure Database for PostgreSQL Flexible Server, an extension can only be CREATEd if it is in the
# server's `azure.extensions` allow-list. When that list doesn't include VECTOR (e.g. after a server
# transfer/restore), `CREATE EXTENSION vector` fails with "not allow-listed", the bootstrap batch
# aborts, `rag_chunks` is never created, and every search_memory/write throws
# `relation "rag_chunks" does not exist`. This job adds VECTOR to the allow-list (append — it never
# clobbers other allow-listed extensions). azure.extensions is a DYNAMIC parameter (no restart).
#
# After this runs green: open the app → Settings → Memory DB → "Run bootstrap" to create the tables
# (canonical DDL lives in code, azure-pg.server.ts BOOTSTRAP_SQL), then "Verify round-trip".
name: Bootstrap Memory DB (allow-list pgvector)

on:
  workflow_dispatch: {}
  # Also fire when this workflow file itself changes, so it can run from a feature branch without
  # first landing on the default branch (workflow_dispatch is only exposed from the default branch).
  # Pushing an edit to this file triggers exactly one run on the branch.
  push:
    paths:
      - .github/workflows/bootstrap-memory-db.yml

env:
  AZURE_RESOURCE_GROUP: EnterpriseDS_ResourceGRP

jobs:
  allowlist-vector:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Identify the app's PG server + allow-list VECTOR on it
        env:
          AZURE_PG_URL: ${{ secrets.AZURE_PG_URL }}
          PG_SERVER_OVERRIDE: ${{ secrets.AZURE_PG_SERVER }}
        run: |
          set -euo pipefail
          RG="$AZURE_RESOURCE_GROUP"

          echo "=== Flexible servers in $RG ==="
          az postgres flexible-server list -g "$RG" --query "[].name" -o tsv || true
          echo "================================"

          # Determine the server the APP actually connects to, so we don't allow-list the wrong one.
          APP_SRV="${PG_SERVER_OVERRIDE:-}"
          if [ -n "$APP_SRV" ]; then
            echo "Using PG_SERVER_OVERRIDE for the app server."
          elif [ -n "${AZURE_PG_URL:-}" ]; then
            echo "AZURE_PG_URL IS available to this workflow — deriving the app server from it."
            HOST=$(printf '%s' "$AZURE_PG_URL" | sed -E 's#^[a-zA-Z]+://[^@]+@([^:/?]+).*#\1#')
            APP_SRV="${HOST%%.*}"
            # Never print the derived name (it's a substring of the secret); print only the match result.
            echo "App server matches 'ux-design-pg': $([ "$APP_SRV" = "ux-design-pg" ] && echo YES || echo NO)"
          else
            echo "AZURE_PG_URL is EMPTY in this workflow (likely an Environment-scoped secret)."
          fi

          # Targets: the app server if we know it, otherwise EVERY server in the RG. Allow-listing an
          # extension is benign — it only PERMITS CREATE EXTENSION, it installs/changes nothing — so
          # covering all servers guarantees the app's server is included when we can't single it out.
          if [ -n "$APP_SRV" ]; then
            TARGETS="$APP_SRV"
            echo "Targeting the identified app server only."
          else
            TARGETS=$(az postgres flexible-server list -g "$RG" --query "[].name" -o tsv)
            echo "App server unknown — targeting all servers in the RG."
          fi

          for SRV in $TARGETS; do
            CURRENT=$(az postgres flexible-server parameter show \
              -g "$RG" -s "$SRV" --name azure.extensions --query value -o tsv 2>/dev/null || echo "")
            if printf '%s' "$CURRENT" | tr ',' '\n' | grep -qix 'vector'; then
              echo "[$SRV] VECTOR already allow-listed"
            else
              if [ -z "$CURRENT" ]; then NEW="VECTOR"; else NEW="${CURRENT},VECTOR"; fi
              az postgres flexible-server parameter set \
                -g "$RG" -s "$SRV" --name azure.extensions --value "$NEW" -o none
              echo "[$SRV] allow-listed VECTOR (was '$CURRENT')"
            fi
          done

          echo "Done. Next: app -> Settings -> Memory DB -> Run bootstrap (creates rag_chunks/rag_triples)."
