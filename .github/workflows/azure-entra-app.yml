name: Provision Entra app (Huddle)

# Gives Huddle its OWN Entra app registration and sets its SPA redirect URIs
# automatically — no portal step, per the enterpriseds "one app per app" rule.
#
# Uses the shared deploy service principal (enterpriseds-github-actions =
# AZURE_CLIENT_ID), which already holds Microsoft Graph Application.ReadWrite.All
# with admin consent in the workforce tenant. No new grant, no manual redirect
# URI entry. `az ad app create` is avoided (it fails under SP auth) — we call
# Microsoft Graph directly.
#
# After a run it prints the app's client id. deploy-azure.yml resolves that same
# app by display name at build time and bakes it into VITE_ENTRA_CLIENT_ID, so
# no copy/paste is needed.

on:
  workflow_dispatch:
    inputs:
      app_display_name:
        description: Entra app display name
        default: enterpriseds-huddle-web
      sign_in_audience:
        description: >-
          AzureADMyOrg (this org only) | AzureADMultipleOrgs |
          AzureADandPersonalMicrosoftAccount (widest — personal + any org)
        default: AzureADMyOrg
      extra_redirect_uri:
        description: Optional extra SPA redirect URI (e.g. a custom domain)
        required: false

env:
  REDIRECT_AZURE: https://enterpriseds-huddle-web.azurewebsites.net
  REDIRECT_LOVABLE_PUB: https://huddle-extension-app.lovable.app
  REDIRECT_LOCAL: http://localhost:3000

jobs:
  provision-entra:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Create or update the Entra app (Microsoft Graph)
        env:
          APP_NAME: ${{ inputs.app_display_name }}
          AUDIENCE: ${{ inputs.sign_in_audience }}
          EXTRA_URI: ${{ inputs.extra_redirect_uri }}
        run: |
          set -euo pipefail

          TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          if [ -z "$TOKEN" ]; then echo "::error::Failed to acquire a Graph token via the deploy SP."; exit 1; fi

          URIS="\"${REDIRECT_AZURE}\",\"${REDIRECT_LOVABLE_PUB}\",\"${REDIRECT_LOCAL}\""
          if [ -n "${EXTRA_URI}" ]; then URIS="${URIS},\"${EXTRA_URI}\""; fi

          EXISTING=$(curl -s -G "https://graph.microsoft.com/v1.0/applications" \
            --data-urlencode "\$filter=displayName eq '${APP_NAME}'" \
            -H "Authorization: Bearer ${TOKEN}" \
            | python3 -c 'import sys,json;a=json.load(sys.stdin).get("value",[]);print(a[0]["id"]+" "+a[0]["appId"] if a else "")')

          if [ -z "${EXISTING}" ]; then
            echo "Creating app ${APP_NAME} (audience ${AUDIENCE})…"
            BODY="{\"displayName\":\"${APP_NAME}\",\"signInAudience\":\"${AUDIENCE}\",\"spa\":{\"redirectUris\":[${URIS}]}}"
            RESP=$(curl -s -X POST "https://graph.microsoft.com/v1.0/applications" \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" -d "${BODY}")
            APPID=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("appId",""))')
            [ -z "$APPID" ] && { echo "::error::Create failed: $RESP"; exit 1; }
          else
            OBJID=$(echo "$EXISTING" | cut -d' ' -f1)
            APPID=$(echo "$EXISTING" | cut -d' ' -f2)
            echo "Updating redirect URIs on existing app ${APP_NAME} (${APPID})…"
            curl -s -X PATCH "https://graph.microsoft.com/v1.0/applications/${OBJID}" \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              -d "{\"spa\":{\"redirectUris\":[${URIS}]}}"
          fi

          echo "## Huddle Entra app" >> "$GITHUB_STEP_SUMMARY"
          echo "- displayName: \`${APP_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- client id: \`${APPID}\` (deploy-azure.yml resolves this by name automatically)" >> "$GITHUB_STEP_SUMMARY"
          echo "- audience: ${AUDIENCE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- redirect URIs: ${REDIRECT_AZURE}, ${REDIRECT_LOVABLE_PUB}, ${REDIRECT_LOCAL}${EXTRA_URI:+, ${EXTRA_URI}}" >> "$GITHUB_STEP_SUMMARY"
