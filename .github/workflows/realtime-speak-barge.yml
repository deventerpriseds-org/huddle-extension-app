name: Realtime-speak BARGE + AGENDA-RETURN UAT

# Proves the user's explicit barge test for the Fast (A) EL-voice hybrid 1:1 voice: ask 3 things in one
# utterance, INTERRUPT after #1, confirm (a) no ghost audio plays over the user after the barge, and
# (b) the agent RETURNS to the still-unanswered questions (#2, #3). Feeds a real 16kHz-mono WAV
# ([3-question ask][short gap → barge lands mid-reply][barge phrase][long tail]) as the Chromium fake
# mic, lets semantic_vad segment turns, and captures: barge detection (2nd speech_started), the outbound
# response.create carrying `instructions` (the agenda-return signal), EL audio play timings (ghost-audio
# check), and agent reply text (Q2/Q3 topic coverage after the barge). Runs on a GH runner (open internet).

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent id (dm-<agent>) to test"
        required: false
        default: "flex-grimes"

jobs:
  realtime-speak-barge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run barge + agenda-return real-mic UAT
        env:
          APP_URL: https://icy-flower-0f415200f.7.azurestaticapps.net
          UAT_BYPASS_TOKEN: ${{ secrets.UAT_BYPASS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}
          AGENT_ID: ${{ github.event.inputs.agent }}
          SHOT_DIR: uat-shots
        run: node e2e/realtime-speak-barge.e2e.mjs

      - name: Upload artifacts (screenshots + mic wav + capture json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-speak-barge-shots
          path: uat-shots/
          retention-days: 7
