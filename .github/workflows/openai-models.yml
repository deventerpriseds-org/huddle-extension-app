name: List OpenAI models (diagnostic)

# Ground-truth which model ids the account can actually call, so we never wire an agent to a
# non-existent id (which would 404 every turn). Reuses the OPENAI_API_KEY secret; read-only.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Case-insensitive substring to grep model ids for (blank = all)."
        required: false
        default: ""

jobs:
  list-models:
    runs-on: ubuntu-latest
    steps:
      - name: GET /v1/models
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FILTER: ${{ inputs.filter }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY secret not set"; exit 1; fi
          echo "----- OPENAI MODELS (filter='${FILTER}') -----"
          curl -s https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY" > models.json
          jq -r --arg f "$FILTER" '.data[].id | select(ascii_downcase | contains($f | ascii_downcase))' models.json | sort
          echo "----- COUNT: $(jq -r --arg f "$FILTER" '[.data[].id | select(ascii_downcase | contains($f | ascii_downcase))] | length' models.json) -----"
          echo "----- END OPENAI MODELS -----"
