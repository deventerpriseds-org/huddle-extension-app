name: Graph permission check (read-only)

# WHAT:       Lists every Microsoft Graph APPLICATION permission Huddle's app holds, and tries the
#             exact calendar read the schedule brief makes (app-only calendarView) for each mailbox
#             given — printing the HTTP status per mailbox. Changes nothing.
# WHY:        The 8am/8pm schedule brief gets "Graph calendarView failed (403): Access is denied"
#             (live dry run, run 38776403438, 2026-10-15). A 403 has two possible causes — the app
#             was never granted Calendars.Read, or an Exchange access policy / RBAC scope excludes
#             the mailbox — and the fix differs. This reads the grants instead of guessing, and is
#             re-runnable to prove the fix after an admin grants access.
#             Section 4 (2026-10-15) also probes app-only Inbox read + Drafts folder access, the
#             premise of an inbound-email watcher (Iris missed Amy Corriveau's email: nothing reads mail).
#             Section 5 (2026-11-08) proves the app-only key can READ the work-mailbox OneDrive feed
#             files (external-feeds/onedrive-feed.server.ts). Power Automate WRITING them proves nothing
#             about Huddle's own application permission. Prints status/size/shape/counts only.
#             Section 5b (2026-11-13) LISTS the feed folders (name, size, modified time only) so a renamed
#             output file is found by reading the drive, not by guessing; a .jsonl path prints line count
#             and the KEY NAMES of its last line (never values).
# SUPERSEDES: nothing.  SUPERSEDED-BY: nothing -- current.
# EVIDENCE:   .claude/evidence/schedule-brief-fix.md; deploy-swa.yml "Ensure Graph Mail.Send" step
#             (grants Mail.Send only).
#
# Uses the SAME credential the running app uses (AZURE_CLIENT_ID / AZURE_CLIENT_SECRET /
# AZURE_TENANT_ID — deploy-swa.yml syncs exactly these; graph-email.server.ts getAppToken).

on:
  workflow_dispatch:
    inputs:
      mailboxes:
        description: "Comma-separated mailboxes to test the calendar read against."
        required: true
        default: "dev@enterpriseds.io,von.ellis@enterpriseds.io"
      feed_drive_users:
        description: "Section 5: comma-separated EDS users whose OneDrive may hold the feed files (blank = skip)."
        required: false
        default: ""
      feed_paths:
        description: "Section 5: comma-separated drive-relative feed file paths."
        required: false
        default: "/automation/email/emails.json,/automation/appointments/appointments.json"
      feed_list_folders:
        description: "Section 5b: comma-separated drive-relative folders to LIST (names/sizes/modified only; needs feed_drive_users)."
        required: false
        default: ""
      feed_dry_run:
        description: "Section 6: dry-run the REAL feed files through the shipped code, using the HUDDLE_ONEDRIVE_FEEDS repo secret (masked in logs). Verdicts and counts only."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.feed_dry_run }}
      - name: Read grants + probe calendar access
        env:
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAILBOXES: ${{ inputs.mailboxes }}
          FEED_USERS: ${{ inputs.feed_drive_users }}
          FEED_PATHS: ${{ inputs.feed_paths }}
          FEED_FOLDERS: ${{ inputs.feed_list_folders }}
          # A SECRET, never a workflow input: inputs are printed in this public log's env block
          # (VERIFY-trinnex-onedrive-feed-1 D1 -- an earlier run printed the config that way).
          FEED_CONFIG: ${{ inputs.feed_dry_run && secrets.HUDDLE_ONEDRIVE_FEEDS || '' }}
        run: |
          set -uo pipefail
          for v in TENANT CLIENT_ID CLIENT_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is empty"; exit 1; fi
          done
          echo "App (client) id in use: $CLIENT_ID"

          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CLIENT_ID" --data-urlencode "client_secret=$CLIENT_SECRET" \
            -d "scope=https://graph.microsoft.com/.default" -d "grant_type=client_credentials" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$TOKEN" ]; then echo "::error::could not get an app-only Graph token"; exit 1; fi

          echo "=== 1. Graph application permissions IN THE TOKEN (what Graph will honour) ==="
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split(".")[1]; p += "=" * (-len(p) % 4)
          claims = json.loads(base64.urlsafe_b64decode(p))
          roles = sorted(claims.get("roles", []))
          print("roles:", ", ".join(roles) if roles else "(none)")
          print("Calendars.Read granted:", any(r in ("Calendars.Read", "Calendars.ReadBasic.All", "Calendars.ReadWrite") for r in roles))
          print("app display name:", claims.get("app_displayname"), "| service principal oid:", claims.get("oid"))
          PY

          echo "=== 2. Mailbox identity (are these one mailbox or two?) ==="
          echo "=== 3. App-only calendar read per mailbox (the schedule brief's exact call) ==="
          START=$(date -u +%Y-%m-%dT00:00:00Z); END=$(date -u -d '+1 day' +%Y-%m-%dT00:00:00Z)
          IFS=',' read -ra MBX <<< "$MAILBOXES"
          for m in "${MBX[@]}"; do
            m=$(echo "$m" | xargs)
            U=$(curl -s -o /tmp/u.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
              "https://graph.microsoft.com/v1.0/users/$m?\$select=id,mail,userPrincipalName")
            UID_=$(python3 -c 'import json;d=json.load(open("/tmp/u.json"));print(d.get("id","-"),d.get("userPrincipalName","-"))' 2>/dev/null || echo "-")
            C=$(curl -s -o /tmp/c.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
              "https://graph.microsoft.com/v1.0/users/$m/calendarView?startDateTime=$START&endDateTime=$END&\$top=1&\$select=subject")
            ERR=$(python3 -c 'import json;d=json.load(open("/tmp/c.json"));e=d.get("error") or {};print(e.get("code",""),"-",(e.get("message") or "")[:160])' 2>/dev/null || true)
            echo "$m | user lookup HTTP $U -> $UID_ | calendarView HTTP $C ${ERR}"
          done
          echo "(user lookup 403 just means the app lacks User.Read.All; it does not affect the calendar read)"

          # 4. Inbox read + Drafts folder access per mailbox — the calls an inbound-email watcher
          #    would make (ACT:inbound-email-watch). Prints status + counts only, never mail bodies.
          echo "=== 4. App-only Inbox read + Drafts folder access per mailbox ==="
          for m in "${MBX[@]}"; do
            m=$(echo "$m" | xargs)
            I=$(curl -s -o /tmp/i.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
              "https://graph.microsoft.com/v1.0/users/$m/mailFolders/inbox/messages?\$top=25&\$orderby=receivedDateTime%20desc&\$select=receivedDateTime,from,isRead")
            ISUM=$(python3 -c '
          import json
          d=json.load(open("/tmp/i.json")); v=d.get("value") or []
          e=(d.get("error") or {}).get("code","")
          hit=[x["receivedDateTime"] for x in v if "trinnex" in str(((x.get("from") or {}).get("emailAddress") or {}).get("address","")).lower()]
          print(len(v), "newest read", e, "| trinnex.io sender among them:", hit if hit else "none")' 2>/dev/null || echo "-")
            D=$(curl -s -o /tmp/d.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
              "https://graph.microsoft.com/v1.0/users/$m/mailFolders/drafts?\$select=displayName,totalItemCount")
            echo "$m | inbox HTTP $I -> $ISUM | drafts folder HTTP $D"
          done

          # 5. App-only READ of the OneDrive feed files (the exact calls readFeed makes: item metadata
          #    with eTag, then /content). THIS REPO'S LOGS ARE PUBLIC: status, size, envelope shape and
          #    counts only -- never subjects, senders, bodies or ids.
          if [ -n "${FEED_USERS// /}" ]; then
            echo "=== 5. App-only OneDrive feed file read ==="
            IFS=',' read -ra FU <<< "$FEED_USERS"; IFS=',' read -ra FP <<< "$FEED_PATHS"
            for u in "${FU[@]}"; do
              u=$(echo "$u" | xargs)
              for p in "${FP[@]}"; do
                p=$(echo "$p" | xargs)
                M=$(curl -s -o /tmp/m.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                  "https://graph.microsoft.com/v1.0/users/$u/drive/root:$p?\$select=eTag,size")
                MSUM=$(python3 -c 'import json;d=json.load(open("/tmp/m.json"));e=(d.get("error") or {}).get("code","");print("size", d.get("size","-"), "etag", "yes" if d.get("eTag") else "no", e)' 2>/dev/null || echo "-")
                C=$(curl -s -L -o /tmp/f.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                  "https://graph.microsoft.com/v1.0/users/$u/drive/root:$p:/content")
                CSUM=$(python3 -c '
          import json
          raw=open("/tmp/f.json", encoding="utf-8", errors="replace").read()
          try:
              d=json.loads(raw)
          except Exception:
              lines=[l for l in raw.splitlines() if l.strip()]
              try:
                  last=json.loads(lines[-1]) if lines else None
              except Exception:
                  last=None
              if isinstance(last, dict):
                  from collections import Counter
                  recs=[]
                  for l in lines:
                      try:
                          o=json.loads(l)
                          if isinstance(o, dict): recs.append(o)
                      except Exception:
                          pass
                  short=lambda v: v if isinstance(v,(bool,int)) or v is None or (isinstance(v,str) and len(v)<=24 and "@" not in v) else "<long/other>"
                  lk=Counter(k for r in recs for k in r)
                  st=Counter(str(short(r.get("status"))) for r in recs)
                  src=Counter(str(short(r.get("source"))) for r in recs)
                  syn=Counter(str(r.get("synthetic","<absent>")) for r in recs)
                  msgs=[m for r in recs for m in (r.get("messages") if isinstance(r.get("messages"),list) else []) if isinstance(m,dict)]
                  withm=sum(1 for r in recs if isinstance(r.get("messages"),list) and r.get("messages"))
                  mk=Counter(k for m in msgs for k in m)
                  fk=Counter(k for m in msgs if isinstance(m.get("from"),dict) for k in m["from"])
                  fu=Counter(k for m in msgs if isinstance(m.get("from"),dict) and isinstance(m["from"].get("user"),dict) for k in m["from"]["user"])
                  bt=Counter(("dict:"+",".join(sorted(m["body"].keys()))) if isinstance(m.get("body"),dict) else type(m.get("body")).__name__ for m in msgs)
                  mt=Counter(str(short(m.get("messageType"))) for m in msgs)
                  ct=Counter(str(short((m.get("body") or {}).get("contentType"))) for m in msgs if isinstance(m.get("body"),dict))
                  ids=Counter((r.get("chatId") is not None) for r in recs)
                  print("JSONL | lines", len(lines), "| parsed", len(recs), "| lines with messages", withm, "| messages total", len(msgs))
                  print("   line keys (count):", dict(lk))
                  print("   status values:", dict(st), "| source values:", dict(src), "| synthetic:", dict(syn), "| chatId present:", dict(ids))
                  print("   message keys (count):", dict(mk))
                  print("   from keys:", dict(fk), "| from.user keys:", dict(fu))
                  print("   body types:", dict(bt), "| contentType:", dict(ct), "| messageType:", dict(mt))
                  tsk=[k for k in ("createdDateTime","timestamp","lastModifiedDateTime") if mk.get(k)]
                  print("   time keys present:", tsk, "| capturedAt range:", min((str(r.get("capturedAt",""))[:10] for r in recs), default="-"), "->", max((str(r.get("capturedAt",""))[:10] for r in recs), default="-"))
              else:
                  print("not JSON, not JSONL | lines", len(lines))
              raise SystemExit
          v=((d.get("snapshot") or {}).get("value")) if isinstance(d,dict) else None
          print("feed_type", d.get("feed_type"), "| schema", d.get("schema_version"), "| complete", d.get("complete"),
                "| synthetic", d.get("synthetic"), "| records", len(v) if isinstance(v,list) else "-",
                "| mailbox domain", str(d.get("mailbox","")).split("@")[-1] or "-")
          # SHAPE ONLY (names + JSON types, never values): what the mapper must read.
          def shape(o, depth=0):
              if isinstance(o, dict):
                  return "{" + ", ".join(f"{k}:{shape(v, depth+1) if depth < 1 else type(v).__name__}" for k, v in sorted(o.items())) + "}"
              if isinstance(o, list):
                  return "[" + (str(len(o)) + "x " + (shape(o[0], depth+1) if depth < 1 else (sorted(o[0].keys()).__str__() if isinstance(o[0], dict) else type(o[0]).__name__)) if o else "") + "]"
              return type(o).__name__
          print("   envelope keys:", sorted(d.keys()) if isinstance(d,dict) else "-")
          if isinstance(v,list) and v: print("   record[0] shape:", shape(v[0]))
          if isinstance(v,list) and v:
              keys=sorted({k for r in v if isinstance(r,dict) for k in r})
              print("   non-empty per field (of", len(v), "records):", {k: sum(1 for r in v if isinstance(r,dict) and r.get(k) not in (None, "", [], {})) for k in keys})' 2>/dev/null || echo "-")
                echo "$u $p | item HTTP $M -> $MSUM | content HTTP $C -> $CSUM"
              done
            done
            echo "(403 on the item = the app lacks Files.Read.All / Files.ReadWrite.All application permission)"
          fi

          # 5b. LIST feed folders: name, size, modified time only (public logs: no content, no ids). A name
          #     holding an address-like token (@) or a long digit run is masked.
          if [ -n "${FEED_USERS// /}" ] && [ -n "${FEED_FOLDERS// /}" ]; then
            echo "=== 5b. OneDrive feed folder listing (names/sizes/modified only) ==="
            IFS=',' read -ra FU <<< "$FEED_USERS"; IFS=',' read -ra FF <<< "$FEED_FOLDERS"
            for u in "${FU[@]}"; do
              u=$(echo "$u" | xargs)
              for f in "${FF[@]}"; do
                f=$(echo "$f" | xargs)
                L=$(curl -s -o /tmp/l.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                  "https://graph.microsoft.com/v1.0/users/$u/drive/root:$f:/children?\$select=name,size,lastModifiedDateTime,folder,file&\$top=200")
                echo "$f | list HTTP $L"
                python3 -c '
          import json, re
          d=json.load(open("/tmp/l.json"))
          e=(d.get("error") or {}).get("code")
          if e: print("   error", e); raise SystemExit
          for c in sorted(d.get("value") or [], key=lambda c: c.get("name","").lower()):
              n=c.get("name","")
              if "@" in n or re.search(r"\d{7,}", n): n="<masked name>"
              kind="folder" if c.get("folder") is not None else "file"
              print("   ", kind, n, "| size", c.get("size","-"), "| modified", c.get("lastModifiedDateTime","-"))' 2>/dev/null || echo "   (unreadable listing)"
              done
            done
          fi

          # 6. Dry-run the REAL feed files through the shipped code (validator, mapper, screen).
          if [ -n "${FEED_CONFIG// /}" ]; then
            echo "=== 6. Feed dry run through the shipped validator / mapper / screenMessage ==="
            TOKEN="$TOKEN" HUDDLE_ONEDRIVE_FEEDS="$FEED_CONFIG" \
              npx -y tsx@4.19.2 scripts/onedrive-feed-dryrun.ts
          fi
