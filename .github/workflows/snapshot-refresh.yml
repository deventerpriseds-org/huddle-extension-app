name: Refresh assistant snapshots (DEPRECATED)

# DEPRECATED — do not run. The in-repo snapshot
# (src/features/huddle/data/openai-assistant-snapshots.json) is now the
# AUTHORITATIVE, git-versioned source of agent instructions (OpenAI is sunsetting
# both the Assistants API and reusable Prompt objects; their guidance is to keep
# prompts code-managed). This job PULLS from the platform and would OVERWRITE the
# authoritative snapshot with stale platform content — so its schedule is removed
# and the manual trigger is guarded off. Kept only for historical reference.

on:
  workflow_dispatch: # manual only; guarded off below (schedule removed)

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Frozen — refuse to run
        run: |
          echo "::error::snapshot-refresh is DEPRECATED. The repo snapshot is the authoritative source; pulling from the platform would clobber it. Edit openai-assistant-snapshots.json directly."
          exit 1

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (public npm)
        run: |
          rm -f bun.lock
          sed -i 's/^minimumReleaseAge = .*/minimumReleaseAge = 0/' bunfig.toml
          bun install --registry https://registry.npmjs.org

      - name: Pull fresh snapshots from the platform
        run: bun run scripts/fetch-openai-assistants.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit and deploy if the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/features/huddle/data/openai-assistant-snapshots.json; then
            echo "Snapshot unchanged — nothing to deploy."
            exit 0
          fi
          git add src/features/huddle/data/openai-assistant-snapshots.json
          git commit -m "Refresh OpenAI assistant snapshots (scheduled)"
          git push origin HEAD:${{ github.ref_name }}
          echo "Snapshot changed — dispatching deploy."
          gh workflow run deploy-swa.yml --ref ${{ github.ref_name }}
