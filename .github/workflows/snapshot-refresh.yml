name: Refresh assistant snapshots

# Keeps the in-repo snapshot in sync with the OpenAI platform, hands-off.
#
# PULL-ONLY: it fetches the current config of every assistant and commits the
# snapshot if anything changed. It does NOT push repo instructions up to the
# platform, so edits made on the OpenAI dashboard are preserved (the opposite
# of sync-assistants.yml, which re-authors the platform from the repo and is
# manual-only). When the snapshot changes it dispatches a deploy so the live
# app picks it up.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (public npm)
        run: |
          rm -f bun.lock
          sed -i 's/^minimumReleaseAge = .*/minimumReleaseAge = 0/' bunfig.toml
          bun install --registry https://registry.npmjs.org

      - name: Pull fresh snapshots from the platform
        run: bun run scripts/fetch-openai-assistants.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit and deploy if the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/features/huddle/data/openai-assistant-snapshots.json; then
            echo "Snapshot unchanged — nothing to deploy."
            exit 0
          fi
          git add src/features/huddle/data/openai-assistant-snapshots.json
          git commit -m "Refresh OpenAI assistant snapshots (scheduled)"
          git push origin HEAD:${{ github.ref_name }}
          echo "Snapshot changed — dispatching deploy."
          gh workflow run deploy-swa.yml --ref ${{ github.ref_name }}
