name: Deploy Huddle Web Search

# Deploys azure/functions/web-search to Azure Functions, mirroring the org's
# bridge-builder deploy-api.yml convention (Azure/functions-action + a
# publish-profile secret; no az login required).
#
# One-time provisioning the publish profile cannot do (needs Azure portal or a
# service principal) — see azure/functions/web-search/README.md:
#   1. Create the resource group, storage account and Function App
#      (huddle-web-search-<short-random>, Node 20, Functions v4, Linux).
#   2. Set the TAVILY_API_KEY application setting on the Function App.
#   3. Add the allowed CORS origins on the Function App.
#   4. Download the app's publish profile and store it as the repo secret
#      AZURE_WEBSEARCH_PUBLISH_PROFILE, and set the repo variable
#      WEBSEARCH_APP_NAME to the app's name.

on:
  push:
    branches:
      - main
      - claude/web-search-azure-function-t4uum6
    paths:
      - 'azure/functions/web-search/**'
      - '.github/workflows/deploy-web-search.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & deploy web-search
    defaults:
      run:
        working-directory: azure/functions/web-search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1.5.2
        with:
          app-name: ${{ vars.WEBSEARCH_APP_NAME }}
          package: azure/functions/web-search
          publish-profile: ${{ secrets.AZURE_WEBSEARCH_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: false
